    #ec-branded-workspace .ec-runtimenote { margin-left:auto; }
    #ec-branded-workspace .ec-librarytabs { display:flex;gap:7px;margin-bottom:25px; }
    #ec-branded-workspace .ec-librarytabs .ec-btn[aria-pressed="true"] { background:var(--ec-tint);color:var(--ec-accent);border-color:transparent; }
    #ec-branded-workspace .ec-libraryrow { display:flex;align-items:center;gap:14px;padding:19px 0;border-bottom:1px solid var(--ec-line);width:100%;text-align:left;background:transparent;border-top:0;border-left:0;border-right:0; }
    #ec-branded-workspace .ec-libraryrow > svg { color:var(--ec-muted); }
    #ec-branded-workspace .ec-libraryrow > span:first-of-type { flex:1;min-width:0; }
    #ec-branded-workspace .ec-libraryrow b { display:block;font-size:14px;overflow-wrap:anywhere; }
    #ec-branded-workspace .ec-libraryrow small { display:block;color:var(--ec-muted);font-size:12px;margin-top:4px; }
    #ec-branded-workspace .ec-detailpane { padding:22px;border:1px solid var(--ec-line);border-radius:10px;background:var(--ec-panel);margin:18px 0; }
    #ec-branded-workspace .ec-detailpane p { margin:10px 0;color:var(--ec-muted);font-size:13px; }
    #ec-branded-workspace .ec-detailpane ul { padding-left:20px;font-size:13px;line-height:1.8; }
    #ec-branded-workspace .ec-docpreview { padding:30px;background:var(--ec-panel);border:1px solid var(--ec-line);border-radius:10px;margin:22px 0; }
    #ec-branded-workspace .ec-docpreview h2 { margin:0 0 18px; }
    #ec-branded-workspace .ec-docpreview h3 { margin:20px 0 8px; }
    #ec-branded-workspace .ec-docpreview p,#ec-branded-workspace .ec-docpreview li { font-size:13px;line-height:1.8; }
    #ec-branded-workspace .ec-docpreview ul { padding-left:20px; }
    @media(max-width:590px) { #ec-branded-workspace .ec-pinned { display:none; } #ec-branded-workspace .ec-navgroup { grid-template-columns:repeat(4,minmax(0,1fr)); } #ec-branded-workspace .ec-navbutton { flex-direction:column;font-size:11px; } #ec-branded-workspace .ec-newwelcome { padding-top:60px; } #ec-branded-workspace .ec-newwelcome p { font-size:13px; } #ec-branded-workspace .ec-runtimebar { padding-inline:6px;gap:2px; } #ec-branded-workspace .ec-runtimenote { display:none; } #ec-branded-workspace .ec-libraryrow { flex-wrap:wrap;gap:10px; } #ec-branded-workspace .ec-libraryrow .ec-badge { margin-left:26px; } #ec-branded-workspace .ec-docpreview { padding:19px; } #ec-branded-workspace .ec-brand-name { gap:6px;font-size:15px; } #ec-branded-workspace .ec-brand-name .ec-official-icon { width:23px; } }

    (() => {
      const root = document.getElementById('ec-branded-workspace');
      const main = root.querySelector('#ec-main');
      const modalMount = root.querySelector('#ec-modal-mount');
      const state = { page:'work', task:'welcome', tab:'activity', phase:'waiting', theme:'kemet', mode:'system', density:'comfortable', inspector:false, radius:12, sidebar:224, note:'', draft:'', attachments:[], attachMenu:false, search:'', chatCount:0, pinned:['webhook'], library:'artifacts', artifact:null, capability:null, connection:null, scheduleOpen:false, setupStep:0, staged:false, provider:'Kimi', model:'kimi-k3', added:false };
      let phaseTimer;
      let returnFocus;
      const icon = name => `<i data-lucide="${name}" aria-hidden="true"></i>`;
      const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const icons = () => { const statusIcon=root.querySelector('[data-task="retry"] > svg,[data-task="retry"] > i');if(statusIcon){statusIcon.outerHTML=icon({waiting:'circle-pause',running:'loader-circle',done:'circle-check',denied:'circle-alert',stopping:'circle-pause',stopped:'square'}[state.phase]);const next=root.querySelector('[data-task="retry"] > i');if(next)next.style.color=state.phase==='done'?'var(--ec-ok)':state.phase==='running'?'var(--ec-accent)':'var(--ec-warning)';}if (globalThis.lucide) globalThis.lucide.createIcons({ attrs:{ width:16,height:16 } }); };
      const announce = text => { root.querySelector('#ec-live').textContent = text; };
      const tasks = { welcome:{title:'New chat',id:'welcome',prompt:'',summary:'',draftOnly:true},retry:{title:'Make billing retries resilient',id:'EC-024',prompt:'Add bounded retries to the billing client. Keep the public API unchanged and verify the retry behavior.',summary:'I added exponential backoff with a three-attempt limit. The public API is unchanged. The focused test suite is ready to run.'},webhook:{title:'Review webhook security',id:'EC-023',prompt:'Review signature validation and identify any unsafe failure paths. Do not change the code.',summary:'Signature validation fails closed. I found one follow-up: the timestamp check should reject replayed requests outside the configured window.'},logs:{title:'Summarize deployment logs',id:'EC-022',prompt:'Review the deployment logs and identify the cause of the latest rollback.',summary:'I reviewed the available logs. The rollout stopped after a failed health check, but the application error logs were unavailable. The root cause remains unconfirmed.'} };

      function renderPinned(){root.querySelector('#ec-pinned-rows').innerHTML=state.pinned.length?state.pinned.map(id=>`<div class="ec-pinnedrow"><button class="ec-taskbutton" data-task="${id}" aria-pressed="${state.page==='work'&&state.task===id}"><span>${esc(tasks[id].title)}<small>${id==='retry'?({waiting:'Needs approval',running:'Running',done:'Completed',denied:'Partially completed',stopping:'Cancellation requested',stopped:'Cancelled'}[state.phase]):id==='logs'?'Partially completed':'Completed'}</small></span></button><button class="ec-btn ec-ghost ec-iconbutton" data-unpin="${id}" aria-label="Unpin ${esc(tasks[id].title)}" data-tooltip="Unpin">${icon('pin-off')}</button></div>`).join(''):'<div class="ec-scope">Pin Work from its header.</div>';root.querySelectorAll('.ec-workspacegroup [data-task]').forEach(b=>{b.hidden=state.pinned.includes(b.dataset.task);});}
      function runtimeBar(){const active=['running','stopping'].includes(state.phase);root.querySelector('#ec-runtimebar').innerHTML=`<button class="ec-btn ec-ghost" data-page="background">${icon('activity')}Local runtime</button><button class="ec-btn ec-ghost ${active?'ec-runtimeactive':''}" data-page="background">${icon('layers-2')}${active?'1 running':'No active runs'}</button>${state.phase==='waiting'?`<button class="ec-btn ec-ghost ec-runtimeattention" data-action="open-approval">${icon('shield-check')}1 needs approval</button>`:''}<button class="ec-btn ec-ghost" data-page="background">${icon('clock-3')}1 scheduled</button><span class="ec-runtimenote">Sample state</span>`;}
      function library(){const a=state.artifact&&artifacts[state.artifact];if(a)return top('Library / Artifacts')+`<div class="ec-page"><button class="ec-btn ec-ghost" data-action="back-artifacts">${icon('arrow-left')}All artifacts</button><div class="ec-pagehead" style="margin-top:20px"><h1>${esc(a.name)}</h1><span class="ec-badge">Sample artifact</span></div><p class="ec-pageintro">${esc(a.kind)}</p><article class="ec-docpreview">${a.body}</article><button class="ec-btn" data-task="${a.task}">${icon('message-square')}Open source Work</button></div>`;return top('Library')+`<div class="ec-page"><h1>Library</h1><p class="ec-pageintro">Your outputs and the capabilities behind them.</p><div class="ec-librarytabs" role="group" aria-label="Library view"><button class="ec-btn" data-library="artifacts" aria-pressed="${state.library==='artifacts'}">${icon('files')}Artifacts</button><button class="ec-btn" data-library="skills" aria-pressed="${state.library==='skills'}">${icon('blocks')}Skills & tools</button></div>${state.library==='artifacts'?Object.entries(artifacts).map(([id,a])=>`<button class="ec-libraryrow" data-artifact="${id}">${icon('file-text')}<span><b>${esc(a.name)}</b><small>${esc(tasks[a.task].title)}</small></span>${icon('arrow-up-right')}</button>`).join(''):capabilities()}<p class="ec-footnote">Illustrative ${state.library==='artifacts'?'outputs linked to their source Work':'capabilities for the Personal profile'}.</p></div>`;}
      function capabilities(){return [{id:'review',name:'Code review',kind:'Skill',status:'Available',note:'Inspect source and summarize findings. File access remains subject to workspace trust and approvals.'},{id:'files',name:'Workspace files',kind:'Toolset',status:'Available',note:'Read and edit files in the selected workspace. The runtime evaluates each requested action against the active policy.'},{id:'browser',name:'Browser automation',kind:'Optional capability',status:'Not configured',note:'Choose and verify a browser backend in setup before use. Configuration does not grant website access or approve actions.'}].map(c=>`<button class="ec-libraryrow" data-capability="${c.id}" aria-expanded="${state.capability===c.id}">${icon(c.kind==='Skill'?'sparkles':c.id==='browser'?'globe':'folder')}<span><b>${c.name}</b><small>${c.kind}</small></span><span class="ec-badge ${c.status==='Available'?'ec-good':''}">${c.status}</span></button>${state.capability===c.id?`<div class="ec-detailpane"><h3>${c.name}</h3><p>${c.note}</p><p>Visibility does not authorize execution.</p></div>`:''}`).join('');}
      function connections(){return top('Connections')+`<div class="ec-page"><h1>Connections</h1><p class="ec-pageintro">Where you can reach your agent.</p><button class="ec-libraryrow" data-connection="telegram" aria-expanded="${state.connection==='telegram'}">${icon('send')}<span><b>Telegram</b><small>Personal profile · 1 authorized chat</small></span><span class="ec-badge ec-good">Connected</span></button>${state.connection==='telegram'?`<div class="ec-detailpane"><h3>Telegram access</h3><dl><div class="ec-kv"><dt>Authorized conversation</dt><dd>Personal control chat · sample</dd></div><div class="ec-kv"><dt>Workspace</dt><dd>payments-api · Local host</dd></div><div class="ec-kv"><dt>Approval mode</dt><dd>Strict</dd></div></dl><p>Other chats are denied. This connection does not broaden workspace access or bypass action approvals.</p><button class="ec-btn" data-page="inbox">Review pending decisions</button></div>`:''}<button class="ec-libraryrow" data-connection="email" aria-expanded="${state.connection==='email'}">${icon('mail')}<span><b>Email</b><small>Configuration required</small></span><span class="ec-badge">Not configured</span></button>${state.connection==='email'?`<div class="ec-detailpane"><h3>Before connecting</h3><p>Select an account, define authorized senders, and review the workspace scope in setup. No account is connected in this preview.</p></div>`:''}<p class="ec-footnote">Sample connection state. No messages or account changes occur.</p></div>`;}
      function background(){const active=['running','stopping'].includes(state.phase);return top('Background work')+`<div class="ec-page"><h1>Background work</h1><p class="ec-pageintro">Execution and schedules in the Personal profile.</p><div class="ec-settingsrow"><div><h3>Local runtime</h3><p>payments-api · Strict approval mode</p></div><span class="ec-badge ec-good">Ready</span></div><h3 style="margin-top:26px">Current work</h3>${state.phase==='waiting'?`<button class="ec-libraryrow" data-action="open-approval">${icon('shield-check')}<span><b>Make billing retries resilient</b><small>Waiting for your command approval</small></span><span class="ec-badge ec-warn">Needs approval</span></button>`:active?`<button class="ec-libraryrow" data-task="retry">${icon('activity')}<span><b>Make billing retries resilient</b><small>${state.phase==='stopping'?'Cancellation requested':'Running the approved test command'}</small></span></button>`:'<p class="ec-footnote">No active runs.</p>'}<h3 style="margin-top:30px">Scheduled</h3><button class="ec-libraryrow" data-action="schedule-details" aria-expanded="${state.scheduleOpen}">${icon('clock-3')}<span><b>Daily workspace summary</b><small>Next: tomorrow, 09:00 · local time</small></span>${icon('chevron-down')}</button>${state.scheduleOpen?`<div class="ec-detailpane"><h3>Daily workspace summary</h3><p>Summarize recent workspace activity each morning.</p><p>Target: payments-api · Local host<br>Profile: Personal · Approval mode: Strict</p><p>Scheduled work follows the same runtime ownership and approval boundaries as interactive work.</p></div>`:''}<p class="ec-footnote">Sample runtime and schedule. This preview starts no background processes.</p></div>`;}
      const guidanceByTask = {};
      function selectTask(task) { guidanceByTask[state.task]={note:state.note,draft:state.draft,attachments:state.attachments};state.task=task;const guidance=guidanceByTask[task]||{note:'',draft:'',attachments:[]};state.note=guidance.note;state.draft=guidance.draft;state.attachments=guidance.attachments;state.attachMenu=false; }
      root.addEventListener('click',event=>{const b=event.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;if(d.page){state.page=d.page;render();if(d.page==='search')main.querySelector('#ec-search')?.focus();return;}if(d.task){selectTask(d.task);state.page='work';state.tab='activity';render();return;}if(d.tab){state.tab=d.tab;render();main.querySelector('#ec-tab-'+d.tab)?.focus();return;}if(d.themeChoice){state.theme=d.themeChoice;render();main.querySelector('[data-theme-choice="'+d.themeChoice+'"]')?.focus();announce(d.themeChoice+' theme selected');return;}if(d.mode){state.mode=d.mode;render();main.querySelector('[data-mode="'+d.mode+'"]')?.focus();return;}const action=d.action;
        if(action==='pin-work'){state.pinned=state.pinned.includes(state.task)?state.pinned.filter(id=>id!==state.task):[...state.pinned,state.task];render();main.querySelector('[data-action="pin-work"]')?.focus();announce('Pinned Work updated.');}
        if(d.unpin){state.pinned=state.pinned.filter(id=>id!==d.unpin);render();announce('Work unpinned.');}
        if(d.library){state.library=d.library;state.artifact=null;render();main.querySelector('[data-library="'+d.library+'"]')?.focus();}
        if(d.artifact){state.artifact=d.artifact;render();}
        if(action==='back-artifacts'){state.artifact=null;render();}
        if(d.capability){state.capability=state.capability===d.capability?null:d.capability;render();main.querySelector('[data-capability="'+d.capability+'"]')?.focus();}
        if(d.connection){state.connection=state.connection===d.connection?null:d.connection;render();main.querySelector('[data-connection="'+d.connection+'"]')?.focus();}
        if(action==='schedule-details'){state.scheduleOpen=!state.scheduleOpen;render();main.querySelector('[data-action="schedule-details"]')?.focus();}
        if(action==='new-chat'){const id='draft-'+(++state.chatCount);tasks[id]={title:'New chat',id:id,prompt:'',summary:'',draftOnly:true};selectTask(id);state.page='work';state.inspector=false;render();main.querySelector('#ec-guidance')?.focus();announce('New local draft chat created.');}
        if(action==='attach'){state.attachMenu=!state.attachMenu;render();main.querySelector('[data-action="'+(state.attachMenu?'choose-files':'attach')+'"]')?.focus();}
        if(action==='choose-files')main.querySelector('#ec-attachment-input').click();
        if(action==='sample-file'){state.attachments.push({name:'retry-requirements.md',size:1240,type:'text/markdown'});state.attachMenu=false;render();main.querySelector('[data-action="attach"]')?.focus();announce('Sample attachment added to this Work.');}
        if(d.removeAttachment!==undefined){state.attachments.splice(Number(d.removeAttachment),1);render();main.querySelector('[data-action="attach"]')?.focus();announce('Attachment removed.');}
        if(action==='approve'){state.phase='running';render();announce('Sample command approved once. Verification running.');phaseTimer=setTimeout(()=>{state.phase='done';render();announce('Sample verification completed. 12 tests passed.');},2200);}
        if(action==='deny'){state.phase='denied';render();announce('Command rejected. Work is partially completed.');}
        if(action==='stop'){clearTimeout(phaseTimer);state.phase='stopping';render();announce('Cancellation requested.');phaseTimer=setTimeout(()=>{state.phase='stopped';render();announce('Execution cancelled.');},1100);}
        if(action==='inspector'){state.inspector=!state.inspector;render();}
        if(action==='view-changes'){state.tab='changes';render();}
        if(action==='view-activity'){state.tab='activity';render();}
        if(action==='open-approval'||action==='back-work'){state.page='work';selectTask('retry');state.tab='activity';render();}
        if(action==='guidance'){const value=root.querySelector('#ec-guidance').value.trim();if(value){state.note=value;state.draft='';if(tasks[state.task].draftOnly){tasks[state.task].prompt=value;tasks[state.task].title=value.length>48?value.slice(0,48)+'…':value;}render();announce('Draft guidance saved locally in the concept.');}}
        if(action==='add-provider'){returnFocus=b;state.setupStep=0;state.staged=false;state.provider='Kimi';state.model='kimi-k3';showModal();}
        if(action==='close-modal')closeModal();
        if(action==='stage-key'){state.provider=root.querySelector('#ec-provider').value;state.model=root.querySelector('#ec-model').value.trim()||'sample-model';state.staged=true;showModal();}
        if(action==='review-provider'){state.provider=root.querySelector('#ec-provider').value;state.model=root.querySelector('#ec-model').value.trim()||'sample-model';state.setupStep=1;showModal();}
        if(action==='apply-provider'){state.added=true;state.staged=false;state.setupStep=2;showModal();announce('Demo provider added.');}
        if(action==='finish-provider'){closeModal();render();main.querySelector('[data-action="add-provider"]')?.focus();}
      });
      root.addEventListener('input',event=>{if(event.target.id==='ec-guidance')state.draft=event.target.value;if(event.target.id==='ec-search'){state.search=event.target.value;main.querySelector('#ec-search-results').innerHTML=searchResults();icons();}});
      root.addEventListener('change',event=>{if(event.target.id==='ec-attachment-input'){for(const file of event.target.files)state.attachments.push({name:file.name,size:file.size,type:file.type});state.attachMenu=false;render();main.querySelector('[data-action=attach]')?.focus();announce('Attachments added locally. No file contents were read or uploaded.');}if(event.target.id==='ec-provider'){state.provider=event.target.value;state.model=state.provider==='Local'?'local-model':'kimi-k3';state.staged=false;showModal();}if(event.target.id==='ec-density'){state.density=event.target.value;render();main.querySelector('#ec-density')?.focus();}});
      root.addEventListener('keydown',event=>{if(event.key==='Escape'&&state.attachMenu){event.preventDefault();state.attachMenu=false;render();main.querySelector('[data-action=attach]')?.focus();return;}if(event.target.matches('[data-tab]')&&['ArrowLeft','ArrowRight','Home','End'].includes(event.key)){event.preventDefault();const tabs=['activity','changes','results'];const index=tabs.indexOf(state.tab);state.tab=event.key==='Home'?tabs[0]:event.key==='End'?tabs[2]:tabs[(index+(event.key==='ArrowRight'?1:2))%3];render();main.querySelector('#ec-tab-'+state.tab)?.focus();}if(event.key==='Escape'&&modalMount.firstChild){event.preventDefault();closeModal();}if(event.key==='Tab'&&modalMount.firstChild){const elements=[...modalMount.querySelectorAll('button:not(:disabled),input,select')];const first=elements[0],last=elements[elements.length-1];if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}}});
      render();
      if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addSlider(state,'sidebar',{label:'Sidebar width',min:200,max:256,step:4,unit:'px'});tweak.addSlider(state,'radius',{label:'Window radius',min:6,max:16,step:2,unit:'px'});tweak.addToggle(state,'inspector',{label:'Show Work inspector'});tweak.addSelect(state,'theme',{label:'Theme family',options:['kemet','graphite','sand']});}
    })();
  </script>
</div>
